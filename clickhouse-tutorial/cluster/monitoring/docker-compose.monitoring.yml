# Overlay: docker compose -f docker-compose.yml -f monitoring/docker-compose.monitoring.yml up -d
services:
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: [ "9090:9090" ]
  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: learn
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
    volumes:
      - ./monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/ds.yml:ro
      - ./monitoring/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/shopstream.yml:ro
      - ./monitoring/shopstream-dashboard.json:/var/lib/grafana/dashboards/shopstream-dashboard.json:ro
    ports: [ "3000:3000" ]
