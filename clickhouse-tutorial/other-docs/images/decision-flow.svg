<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" font-family="Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#374151"/></marker></defs><text x="20" y="30" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="start">Choosing columnar vs RDBMS</text><rect x="40" y="50" width="300" height="56" rx="8" fill="#fef9c3" stroke="#374151"/><text x="190.0" y="75.0" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">Needs transactions or frequent</text><text x="190.0" y="91.0" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">single-row updates?</text><rect x="40" y="150" width="300" height="56" rx="8" fill="#fef9c3" stroke="#374151"/><text x="190.0" y="175.0" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">Queries mostly aggregate many rows</text><text x="190.0" y="191.0" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">using few columns?</text><rect x="40" y="250" width="300" height="56" rx="8" fill="#fef9c3" stroke="#374151"/><text x="190.0" y="275.0" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">Large or fast-growing data, or</text><text x="190.0" y="291.0" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">analytics slowing the OLTP DB?</text><rect x="40" y="350" width="300" height="56" rx="8" fill="#fef9c3" stroke="#374151"/><text x="190.0" y="375.0" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">Can writes be batched or buffered?</text><text x="190.0" y="391.0" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">(Kafka, async inserts)</text><rect x="90" y="450" width="200" height="50" rx="8" fill="#dcfce7" stroke="#374151"/><text x="190.0" y="480.0" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">Columnar (ClickHouse)</text><rect x="480" y="50" width="280" height="56" rx="8" fill="#dbeafe" stroke="#374151"/><text x="620.0" y="75.0" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">RDBMS as source of truth</text><text x="620.0" y="91.0" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">(Postgres, MySQL)</text><rect x="480" y="150" width="280" height="56" rx="8" fill="#f3f4f6" stroke="#374151"/><text x="620.0" y="175.0" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">Also need analytics on it?</text><text x="620.0" y="191.0" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">→ copy to ClickHouse via CDC</text><rect x="480" y="250" width="280" height="56" rx="8" fill="#dbeafe" stroke="#374151"/><text x="620.0" y="275.0" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">Stay on RDBMS: indexes,</text><text x="620.0" y="291.0" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">materialized views, read replica</text><rect x="480" y="350" width="280" height="56" rx="8" fill="#f3f4f6" stroke="#374151"/><text x="620.0" y="375.0" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">Add a buffer first (Kafka),</text><text x="620.0" y="391.0" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">then columnar</text><line x1="190" y1="106" x2="190" y2="150" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/><text x="196.0" y="124.0" font-size="12" font-weight="bold" fill="#374151" text-anchor="start">No</text><line x1="190" y1="206" x2="190" y2="250" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/><text x="196.0" y="224.0" font-size="12" font-weight="bold" fill="#374151" text-anchor="start">Yes</text><line x1="190" y1="306" x2="190" y2="350" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/><text x="196.0" y="324.0" font-size="12" font-weight="bold" fill="#374151" text-anchor="start">Yes</text><line x1="190" y1="406" x2="190" y2="450" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/><text x="196.0" y="424.0" font-size="12" font-weight="bold" fill="#374151" text-anchor="start">Yes</text><line x1="340" y1="78" x2="480" y2="78" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/><text x="416.0" y="74.0" font-size="12" font-weight="bold" fill="#374151" text-anchor="start">Yes</text><line x1="620" y1="106" x2="620" y2="150" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/><path d="M340,178 L410,178 L410,90 L480,90" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/><text x="350" y="172" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="start">No</text><line x1="340" y1="278" x2="480" y2="278" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/><text x="416.0" y="274.0" font-size="12" font-weight="bold" fill="#374151" text-anchor="start">No</text><line x1="340" y1="378" x2="480" y2="378" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/><text x="416.0" y="374.0" font-size="12" font-weight="bold" fill="#374151" text-anchor="start">No</text></svg>