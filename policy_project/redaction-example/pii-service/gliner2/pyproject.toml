[project]
name = "pii-service"
version = "0.1.0"
description = "PII detection sidecar for the Go gateway, using GLiNER2-PII on CPU"
requires-python = ">=3.10"
dependencies = [
    # "local" pulls in torch/transformers, needed to run the model in-process.
    "gliner2[local]>=2.0,<3",
    # Listed directly so the CPU-only index below applies to it.
    "torch>=2.1,<3",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[tool.uv]
# pii_service.py is a single script, not an installable package.
package = false

# Use CPU-only torch wheels on Linux/Windows (avoids multi-GB CUDA downloads).
# macOS wheels on PyPI are already CPU/MPS-only.
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform != 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
