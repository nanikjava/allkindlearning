[project]
name = "pii-service-presidio"
version = "0.1.0"
description = "PII detection sidecar for the Go gateway, using Microsoft Presidio on CPU"
requires-python = ">=3.10"
dependencies = [
    "presidio-analyzer>=2.2,<3",
    "presidio-anonymizer>=2.2,<3",
    # spaCy NER model Presidio uses for names, locations, etc.
    "en_core_web_lg @ https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[tool.uv]
# pii_service.py is a single script, not an installable package.
package = false
