name: Build pii-service-spacy image

on:
  push:
    branches: [main]
    paths:
      - "policy_project/redaction-example/pii-service/spacy/**"
      - ".github/workflows/pii-spacy-image.yml"
  workflow_dispatch:   # lets you start it by hand from the Actions tab

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/pii-service-spacy
  CONTEXT: policy_project/redaction-example/pii-service/spacy

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # needed to push to ghcr.io
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ env.CONTEXT }}
          push: true
          # Always overwrite the same tag so :latest tracks main.
          tags: ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
