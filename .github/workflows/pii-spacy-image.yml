name: Build pii-service-spacy image

on:
  push:
    branches: [main]
    paths:
      - "policy_project/redaction-example/pii-service/spacy/**"
      - ".github/workflows/pii-spacy-image.yml"
    tags: ["pii-spacy-v*"]
  workflow_dispatch:   # lets you start it by hand from the Actions tab

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/pii-service-spacy
  CONTEXT: policy_project/redaction-example/pii-service/spacy

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # needed to push to ghcr.io
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=match,pattern=pii-spacy-v(.*),group=1

      - uses: docker/build-push-action@v6
        with:
          context: ${{ env.CONTEXT }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
